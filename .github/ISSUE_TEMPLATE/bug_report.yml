name: Bug report
description: Report something that does not work as documented
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, and what went wrong?
      placeholder: |
        python3 security_txt_checker.py https://example.com
        ...paste the full output here...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should the tool have reported instead?
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python3 --version`
      placeholder: "3.12.3"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. Ubuntu 24.04, macOS 15, Windows 11
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links, screenshots, or extra context.
    validations:
      required: false
